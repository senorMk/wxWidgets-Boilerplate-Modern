name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        preset: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libgl1-mesa-dev libglu1-mesa-dev xvfb
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 3
      - name: Test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --preset ${{ matrix.preset }}
      - name: Test on Windows and macOS
        if: runner.os != 'Linux'
        run: ctest --preset ${{ matrix.preset }}
